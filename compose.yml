# ฐานข้อมูลสำหรับตอนพัฒนา — Postgres + pgAdmin
#
# ค่า user รหัสผ่าน ชื่อฐานข้อมูล และพอร์ต ตรงกับ compose.yml ของทีมทุกตัว
# ที่เพิ่มมาจากของทีมคือ healthcheck บังคับ UTF-8 และลงทะเบียนเซิร์ฟเวอร์ให้ pgAdmin ไว้ล่วงหน้า
# สามอย่างนี้ไม่กระทบการเชื่อมต่อ ใครจะใช้ไฟล์ของทีมแทนก็ได้
#
# วิธีใช้
#   docker compose up -d          เปิดฐานข้อมูลกับ pgAdmin
#   docker compose down           ปิด (ข้อมูลยังอยู่ใน volume)
#   docker compose down -v        ปิดและล้างข้อมูลทิ้งทั้งหมด
#
# เปิดแล้วให้ backend ต่อโดยคัดลอก backend/.env.example เป็น backend/.env
# ค่าเริ่มต้นในนั้นชี้มาที่ compose ชุดนี้อยู่แล้ว ไม่ต้องแก้อะไรถ้าไม่ได้เปลี่ยนพอร์ต

services:
  postgres:
    image: postgres:17
    container_name: lms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-t09}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456789}
      POSTGRES_DB: ${POSTGRES_DB:-t09db}
      # บังคับ UTF-8 เพื่อให้เก็บภาษาไทยได้ถูกต้อง
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # เปิดพอร์ตออกมาให้ backend ที่รันบนเครื่อง (ไม่ได้อยู่ใน container) ต่อได้
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pgAdmin ต้องรอจนกว่าฐานข้อมูลจะพร้อมจริง ไม่ใช่แค่ container เริ่มทำงาน
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-t09} -d ${POSTGRES_DB:-t09db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: lms_pgadmin
    restart: unless-stopped
    environment:
      # ต้องเป็นอีเมลที่รูปแบบถูกต้องจริง pgAdmin ไม่รับโดเมนอย่าง .local จะวนรีสตาร์ท
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-user@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-mypassword}
      # โหมดเครื่องเดียว ไม่ต้องล็อกอิน pgAdmin ซ้ำอีกชั้นตอนพัฒนา
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-8081}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin:/var/lib/pgadmin
      # ลงทะเบียนเซิร์ฟเวอร์ไว้ให้แล้ว เปิด pgAdmin มาก็เห็นฐานข้อมูลเลย ไม่ต้องกรอก host เอง
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro

volumes:
  pgdata:
  pgadmin:
